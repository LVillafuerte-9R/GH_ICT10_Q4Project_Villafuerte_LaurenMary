<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 10 Class Website</title>

    <link rel="stylesheet" href="style.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h2 class="logo">Grade 10 ✦ ICT Website</h2>

        <ul>
            <li><a href="index.html">Classmates</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="photos.html">Photos</a></li>
        </ul>
    </nav>

    <!-- CLASSMATES -->
    <div class="card">
        <h1>Grade 10 Classmates System</h1>

        <input type="text" id="name-input" placeholder="Enter Name">

        <select id="section-input">
            <option value="Emerald">Emerald</option>
            <option value="Ruby">Ruby</option>
            <option value="Sapphire">Sapphire</option>
            <option value="Topaz">Topaz</option>
        </select>

        <input type="text" id="subject-input" placeholder="Favorite Subject">

        <div class="buttons">
            <button py-click="add_new_classmate">Add Classmate</button>

            <button py-click="show_all_classmates">
                Show List
            </button>
        </div>
    </div>

    <div class="list-card">
        <h2>Classmate List</h2>

        <div id="output"></div>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
